<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Animation Archive</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f3f1ec;color:#111;font-family:Arial,sans-serif}
    .archive{max-width:1120px;margin:38px auto;padding:0 24px 70px}
    .window{background:#fff;border-radius:20px;box-shadow:0 18px 45px #0001;overflow:hidden}
    .bar{height:40px;background:#f5f5f5;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 14px;gap:7px}
    .dot{width:10px;height:10px;border-radius:50%}
    .r{background:#ff635e}.y{background:#ffbd44}.g{background:#28c840}
    .bar-title{margin:auto;font:11px Arial;letter-spacing:.14em;color:#858585}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:20px}
    .tile{position:relative;min-width:0;margin:0;aspect-ratio:4/5;overflow:hidden;border-radius:9px;background:#111;border:1px solid #444;box-shadow:0 3px 8px #0002;transition:.25s}
    .tile:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 12px 22px #0003;z-index:2}
    .tile video{display:block;width:100%;height:100%;object-fit:contain;background:#111}
    .num{position:absolute;left:8px;bottom:7px;color:#fff;font:10px "Courier New";text-shadow:0 1px 3px #000;pointer-events:none}
    .caption{padding:8px 22px 24px;text-align:center;color:#888;font:10px "Courier New";letter-spacing:.14em}
    .below{margin-top:55px}
    .below h1{font:700 64px Georgia,serif;margin:0}
    .below p{font:12px "Courier New";letter-spacing:.12em}
    @media(max-width:1023px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:700px){
      .archive{margin:14px auto;padding:0 8px 48px}
      .window{border-radius:14px}
      .bar{height:34px;padding:0 10px;gap:5px}
      .dot{width:8px;height:8px}
      .bar-title{font-size:9px;letter-spacing:.1em}
      .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;padding:7px}
      .tile{border-radius:7px}
      .num{left:5px;bottom:4px;font-size:8px}
      .caption{padding:8px 10px 16px;font-size:8px;line-height:1.5;letter-spacing:.1em}
      .below{margin-top:34px}
      .below h1{font-size:48px}
      .below p{font-size:10px;line-height:1.5}
    }
    @media(max-width:300px){.grid{grid-template-columns:1fr}}
  </style>
  <link rel="stylesheet" href="./site-nav.css">
</head>
<body>
  <nav class="global-nav">
    <a class="nav-home" href="./index.html">← BACK</a>
    <div class="global-portfolio">
      <button type="button">Portfolio</button>
      <div class="global-menu">
        <a href="./media-art-surface-level.html">Media Art</a>
        <a href="./graphic-design.html">Graphic Design</a>
        <a href="./animation.html">Animation</a>
        <a href="./drawings.html">Drawings</a>
      </div>
    </div>
    <a href="./index.html#about">About</a>
    <a href="./index.html#contact">Contact</a>
  </nav>
  <main class="archive">
    <section class="window">
      <div class="bar">
        <i class="dot r"></i><i class="dot y"></i><i class="dot g"></i>
        <div class="bar-title">ANIMATION ARCHIVE · SELECTED WORKS</div>
      </div>
      <div class="grid">
        <figure class="tile"><video src="animation/original.mp4" controls autoplay muted loop playsinline preload="metadata"></video><span class="num">01</span></figure>
        <figure class="tile"><video src="animation/fan-02.mp4" controls autoplay muted loop playsinline preload="metadata"></video><span class="num">02</span></figure>
        <figure class="tile"><video src="animation/fan-03.mp4" controls autoplay muted loop playsinline preload="metadata"></video><span class="num">03</span></figure>
        <figure class="tile"><video src="animation/fan-04.mp4" controls autoplay muted loop playsinline preload="metadata"></video><span class="num">04</span></figure>
        <figure class="tile"><video src="animation/fan-05.mp4" controls autoplay muted loop playsinline preload="metadata"></video><span class="num">05</span></figure>
        <figure class="tile"><video src="animation/fan-06.mp4" controls autoplay muted loop playsinline preload="metadata"></video><span class="num">06</span></figure>
        <figure class="tile"><video src="animation/fan-07.mp4" controls autoplay muted loop playsinline preload="metadata"></video><span class="num">07</span></figure>
      </div>
      <div class="caption">SEVEN SELECTED ANIMATIONS · ORIGINAL ASPECT RATIOS · CLICK TO PLAY WITH SOUND</div>
    </section>
    <section class="below"><h1>Animation</h1><p>ORIGINAL WORK · FAN-MADE WORKS · 3D ANIMATION</p></section>
  </main>
  <script src="./content.js"></script>
  <script>
    document.querySelectorAll('.grid video').forEach(video => {
      video.muted = true;
      video.defaultMuted = true;
      const startPlayback = () => video.play().catch(() => {});
      startPlayback();
      if (video.readyState < 2) video.addEventListener('canplay', startPlayback, { once: true });
    });
  </script>
  <script src="./site-nav.js"></script>
  <script src="./content-loader.js"></script>
</body>
</html>
