<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yiktan's Portfolio</title>
  <style>
    *{box-sizing:border-box}
    :root{--paper:#f8f7f2;--screen:#dfe8ec;--ink:#17191b}
    body{margin:0;background:#efefef;color:var(--ink);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
    .canvas{position:relative;min-height:calc(100vh - 16px);margin:16px auto 0;max-width:1200px;background:var(--paper);overflow:hidden;padding:60px 6vw 110px}
    .orbit{position:absolute;width:370px;height:120px;border:2px solid;border-radius:50%;top:-37px;left:9%;transform:rotate(15deg);z-index:1}
    .orbit.b{left:26%;top:-39px;transform:rotate(-10deg)}
    .dot{position:absolute;width:22px;height:22px;border-radius:50%;z-index:1}
    .blue{left:16%;top:72px;background:#68b6ee}.red{left:62%;top:42px;background:#ff5758}.orange{right:18%;top:58px;background:#ffae4d}.green{right:8%;top:92px;background:#9cdb55}.pink{left:25%;top:145px;background:#d843f5}.magenta{left:12%;top:235px;background:#ed4fd6}
    .sticker-field{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
    .sticker{position:absolute;left:var(--x);top:var(--y);width:var(--w);height:auto;object-fit:contain;filter:drop-shadow(0 8px 9px #0002);animation:float var(--d) ease-in-out infinite alternate;animation-delay:var(--delay)}
    .sticker:nth-child(even){animation-name:floatReverse}
    @keyframes float{from{transform:translate(-65px,-42px) rotate(var(--r))}to{transform:translate(72px,58px) rotate(calc(var(--r) + 8deg))}}
    @keyframes floatReverse{from{transform:translate(68px,-54px) rotate(var(--r))}to{transform:translate(-76px,66px) rotate(calc(var(--r) - 7deg))}}
    .start{position:absolute;z-index:5;left:50%;top:55%;transform:translate(-50%,-50%);font:900 23px "Arial Black",Arial;cursor:pointer;white-space:nowrap}
    .monitor{position:relative;z-index:4;width:min(680px,86vw);margin:46px auto 0;background:#dfd9cb;border:6px solid #d1c9b9;border-radius:19px;padding:21px 21px 60px;box-shadow:0 15px 24px #0002}
    .screen{height:400px;background:var(--screen);border:3px solid #23323a;box-shadow:inset 0 0 0 2px #81a4b2;position:relative;padding:27px 32px}
    .screen-nav{display:flex;gap:34px;font-family:"Arial Black",Arial,Helvetica,sans-serif;font-size:20px;font-weight:900;letter-spacing:-.045em}
    .screen-nav a{color:inherit;text-decoration:none}
    .screen-nav a:first-child{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
    .screen-title{font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;font-size:clamp(45px,5.2vw,58px);font-weight:900;text-align:center;margin-top:105px;letter-spacing:-.055em;white-space:nowrap}
    .stand{position:absolute;left:50%;bottom:-70px;transform:translateX(-50%);width:285px;height:72px;background:#d8d1c3;border-radius:0 0 48px 48px;z-index:-1}
    .menu{position:absolute;top:80px;left:160px;width:300px;background:#dfe8ec;border:3px solid;border-radius:15px;padding:15px 11px;display:none;z-index:10;box-shadow:0 7px 0 #0001}
    .menu.open{display:block}
    .menu a{display:block;color:#17191b;text-decoration:none;font:900 17px/1.65 "Arial Black",Arial;letter-spacing:-.035em}
    .menu a:hover{text-decoration:underline}
    .info-card{position:absolute;inset:0;background:#dfe8ec;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:9}
    .info-card.open{display:flex}
    .card-back{position:absolute;left:22px;top:20px;border:0;background:transparent;color:#111;padding:4px 0;font:900 15px "Arial Black",Arial;letter-spacing:-.04em;cursor:pointer}
    .card-back:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
    .info-inner h2{font-size:42px;font-weight:900;line-height:1.02;margin:0 0 26px}
    .info-inner h3{max-width:520px;font-size:24px;line-height:1.2;font-weight:800;margin:0 auto 30px}
    .about-card .info-inner p{max-width:700px;font-family:Arial,Helvetica,sans-serif;font-size:clamp(19px,2vw,25px);font-weight:400;line-height:1.45;margin:0 auto 31px}
    .about-card .info-inner p:last-child{margin-top:38px;font-size:clamp(17px,1.7vw,21px);font-weight:600}
    .contact-card .info-inner p{max-width:560px;font-size:17px;line-height:1.45;margin:0 auto 18px}
    .contact-card .info-inner p:last-child{margin-top:28px;font-weight:700}
    @media(max-width:820px){.monitor{width:min(680px,94vw)}.sticker{width:calc(var(--w) * .72)}}
    @media(max-width:700px){
      .canvas{padding:50px 12px 105px}
      .screen{height:330px;padding:18px}
      .screen-nav{gap:15px;font-size:15px}
      .screen-title{font-size:clamp(36px,9vw,48px);margin-top:88px}
      .menu{left:62px;top:58px;width:235px}
      .menu a{font-size:15px}
      .start{font-size:17px}
      .monitor{padding:13px 13px 45px}
      .stand{width:210px;height:55px;bottom:-53px}
      .sticker-field{opacity:.72}
      .about-card .info-inner p{font-size:18px;line-height:1.45}
    }
  </style>
  <link rel="stylesheet" href="./about-icons.css">
  <link rel="stylesheet" href="./about-compact.css">
  <link rel="stylesheet" href="./mini-interaction.css">
</head>
<body>
  <main class="canvas">
    <div class="orbit"></div><div class="orbit b"></div>
    <i class="dot blue"></i><i class="dot red"></i><i class="dot orange"></i><i class="dot green"></i><i class="dot pink"></i><i class="dot magenta"></i>
    <div class="sticker-field">
      <img class="sticker" style="--x:80%;--y:12%;--w:110px;--d:9s;--delay:-6s;--r:8deg" src="home-stickers/rice-direct.png" alt="">
      <img class="sticker" style="--x:3%;--y:56%;--w:140px;--d:11s;--delay:-4s;--r:7deg" src="home-stickers/pie.png" alt="">
      <img class="sticker" style="--x:83%;--y:57%;--w:145px;--d:10s;--delay:-8s;--r:-9deg" src="home-stickers/noodle.png" alt="">
      <img class="sticker" style="--x:18%;--y:78%;--w:160px;--d:12s;--delay:-3s;--r:-5deg" src="home-stickers/board.png" alt="">
      <img class="sticker" style="--x:67%;--y:78%;--w:145px;--d:9.5s;--delay:-1s;--r:11deg" src="home-stickers/pizza.png" alt="">
      <img class="sticker" style="--x:8%;--y:34%;--w:105px;--d:10.5s;--delay:-7s;--r:6deg" src="home-stickers/cake.png" alt="">
      <img class="sticker" style="--x:84%;--y:35%;--w:145px;--d:8.5s;--delay:-5s;--r:-7deg" src="home-stickers/sushi-direct.png" alt="">
    </div>
    <section class="monitor">
      <div class="screen">
        <nav class="screen-nav">
          <a href="./index.html" class="home">Home</a>
          <a href="#" class="portfolio">Portfolio</a>
          <a href="#about" class="about">About</a>
          <a href="#contact" class="contact">Contact</a>
        </nav>
        <div class="start">&gt;START&lt;</div>
        <div class="menu">
          <a href="./media-art-surface-level.html">Media Art</a>
          <a href="./graphic-design.html">Graphic Design</a>
          <a href="./animation.html">Animation</a>
          <a href="./drawings.html">Drawings</a>
        </div>
        <div class="info-card about-card">
          <button class="card-back" type="button">← BACK</button>
          <div class="info-inner">
            <h2>Hi,<br>I'm Yiktan.</h2>
            <h3>I make things somewhere between 3D, design and digital experiments.</h3>
            <p>Education</p>
            <p>Interests</p>
          </div>
        </div>
        <div class="info-card contact-card">
          <button class="card-back" type="button">← BACK</button>
          <div class="info-inner"><h2>LEUNG YIKTAN</h2><p>qyiktandmu@gmail.com</p></div>
        </div>
      </div>
      <div class="stand"></div>
    </section>
  </main>
  <script src="./content.js"></script>
  <script>
    const portfolio=document.querySelector('.portfolio'),menu=document.querySelector('.menu'),contact=document.querySelector('.contact'),about=document.querySelector('.about'),contactCard=document.querySelector('.contact-card'),aboutCard=document.querySelector('.about-card'),home=document.querySelector('.home');
    function closeAll(){menu.classList.remove('open');contactCard.classList.remove('open');aboutCard.classList.remove('open')}
    portfolio.onclick=e=>{e.preventDefault();const opening=!menu.classList.contains('open');closeAll();if(opening)menu.classList.add('open')};
    contact.onclick=e=>{e.preventDefault();closeAll();contactCard.classList.add('open');history.replaceState(null,'','#contact')};
    about.onclick=e=>{e.preventDefault();closeAll();aboutCard.classList.add('open');history.replaceState(null,'','#about')};
    home.onclick=e=>{e.preventDefault();closeAll();history.replaceState(null,'',location.pathname)};
    document.querySelectorAll('.card-back').forEach(button=>button.onclick=()=>{closeAll();history.replaceState(null,'',location.pathname)});
    if(location.hash==='#contact')contact.click();
    if(location.hash==='#about')about.click();
  </script>
  <script src="./mini-interaction.js"></script>
  <script src="./about-tools.js"></script>
  <script src="./content-loader.js"></script>
</body>
</html>
